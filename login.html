<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174d2a">
    <title>Workspace Sign In | ISOMS</title>
    <style>
        :root {
            --green: #174d2a;
            --green-dark: #10361f;
            --gold: #f2c94c;
            --ink: #173d27;
            --muted: #526257;
            --line: #e5eadf;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            grid-template-rows: auto 1fr;
            margin: 0;
            background: #f5f7ef;
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            display: flex;
            min-height: 70px;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 12px clamp(20px, 7vw, 104px);
            background: var(--green);
            color: #fff;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: inherit;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.14em;
        }

        .back-link {
            color: #fff;
            font-size: 0.84rem;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover,
        .back-link:focus-visible {
            color: var(--gold);
        }

        .main {
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: min(100%, 520px);
            padding: clamp(24px, 5vw, 34px);
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 14px 36px rgba(23, 42, 30, 0.16);
        }

        .auth-form {
            display: grid;
            gap: 14px;
        }

        .auth-form [hidden] {
            display: none;
        }

        .auth-form label {
            display: grid;
            gap: 6px;
            color: #354b3c;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .auth-form input {
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #cfd8d1;
            border-radius: 7px;
            color: var(--ink);
            font: inherit;
        }

        .password-control {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .password-field {
            display: grid;
            gap: 6px;
        }

        .password-control input {
            width: 100%;
            min-width: 0;
        }

        .password-visibility {
            display: grid;
            width: 44px;
            min-width: 44px;
            min-height: 42px;
            place-items: center;
            border: 1px solid #cfd8d1;
            border-radius: 7px;
            background: #fff;
            color: var(--green);
            cursor: pointer;
        }

        .password-visibility svg {
            width: 19px;
            height: 19px;
        }

        .auth-form input:focus-visible,
        .auth-form button:focus-visible,
        .auth-toggle:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        .auth-button {
            min-height: 44px;
            border: 0;
            border-radius: 7px;
            background: var(--green);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 0.84rem;
            font-weight: 800;
        }

        .auth-button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .auth-actions {
            display: grid;
            gap: 9px;
        }

        .auth-toggle {
            padding: 8px;
            border: 0;
            background: transparent;
            color: var(--green);
            cursor: pointer;
            font: inherit;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .auth-message {
            min-height: 20px;
            margin: 12px 0 0;
            color: #8a3b26;
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .auth-message[data-kind="success"] {
            color: var(--green);
        }

        h1 {
            width: fit-content;
            margin: 0 0 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--green);
            color: #66736d;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .intro {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.55;
        }

        .email-status {
            margin-top: 18px;
        }

        .email-status label {
            display: block;
            margin-bottom: 2px;
            color: #59665e;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .email-field {
            display: flex;
            min-height: 42px;
            align-items: center;
            gap: 10px;
            padding: 0 8px 0 10px;
            border-bottom: 1px solid #cfd8d1;
        }

        .email-field input {
            width: 100%;
            min-width: 0;
            padding: 8px 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #65736a;
            font-size: 0.86rem;
            cursor: not-allowed;
        }

        .email-field input:disabled {
            opacity: 1;
            -webkit-text-fill-color: #65736a;
        }

        .email-icon {
            display: grid;
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            color: #829187;
        }

        .email-status small {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 0.74rem;
            line-height: 1.5;
        }

        .secure-notice {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px auto 0;
            padding: 12px 14px;
            border: 1px solid #d8e2da;
            border-radius: 8px;
            background: #f7faf7;
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 1.5;
        }

        .verification-icon {
            display: grid;
            width: 30px;
            height: 30px;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 50%;
            background: #e5f2e8;
            color: #23884b;
            font-size: 1rem;
            font-weight: 800;
        }

        .secure-notice strong {
            display: block;
            color: #354b3c;
        }

        .provider-button {
            display: flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: min(100%, 280px);
            margin: 22px auto 0;
            padding: 10px 16px;
            border: 0;
            border-radius: 7px;
            background: var(--green);
            color: #fff;
            cursor: not-allowed;
            font-size: 0.84rem;
            font-weight: 800;
            opacity: 0.68;
        }

        .setup-note {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 0.74rem;
            line-height: 1.55;
            text-align: center;
        }

        .recovery-note {
            margin: 12px 0 0;
            color: #1769c2;
            font-size: 0.74rem;
            text-align: center;
        }

        .disclaimer {
            margin: 18px 0 0;
            padding-top: 13px;
            border-top: 1px solid #edf1eb;
            color: #758078;
            font-size: 0.74rem;
            line-height: 1.55;
        }

        .demo-access {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid #edf1eb;
        }

        .demo-access h2 {
            margin: 0;
            color: var(--ink);
            font-size: 1rem;
        }

        .demo-access-copy {
            margin: 8px 0 14px;
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 1.55;
        }

        .role-options {
            display: grid;
            gap: 9px;
        }

        .role-option {
            display: flex;
            min-height: 42px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid #d8e2da;
            border-radius: 8px;
            background: #fff;
            color: var(--green);
            cursor: pointer;
            font: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: left;
        }

        .role-option:hover,
        .role-option:focus-visible {
            border-color: var(--green);
            background: #f4f7f1;
        }

        .role-option span:last-child {
            color: #718076;
            font-size: 1rem;
        }

        .role-message {
            min-height: 18px;
            margin: 10px 0 0;
            color: #8a3b26;
            font-size: 0.74rem;
            line-height: 1.45;
        }

        @media (max-width: 560px) {
            .header {
                min-height: 62px;
                padding: 10px 16px;
            }

            .brand-mark {
                width: 40px;
                height: 40px;
            }

            .brand-name {
                font-size: 0.92rem;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a class="brand" href="index.html" aria-label="ISOMS home">
            <span class="brand-mark" aria-hidden="true">I</span>
            <span class="brand-name">ISOMS</span>
        </a>
        <a class="back-link" href="index.html">← Back to home</a>
    </header>

    <main class="main">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Sign In</h1>
            <p class="intro" id="auth-intro">Sign in with your account email. New accounts must be approved and assigned a role by an administrator before they can open a workspace.</p>
            <form class="auth-form" id="auth-form">
                <label for="display-name" id="display-name-label" hidden>Full name
                    <input id="display-name" name="displayName" type="text" autocomplete="name" maxlength="100">
                </label>
                <label for="email" id="email-label">Email address
                    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                </label>
                <div class="password-field">
                    <label for="password">Password</label>
                    <span class="password-control">
                        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
                        <button class="password-visibility" id="toggle-password-visibility" type="button" aria-label="Show password" aria-pressed="false">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </span>
                </div>
                <div class="auth-actions">
                    <button class="auth-button" id="sign-in-button" type="submit">Sign in</button>
                    <button class="auth-toggle" id="forgot-password" type="button">Forgot password?</button>
                    <button class="auth-toggle" id="toggle-sign-up" type="button">Create an account</button>
                </div>
            </form>
            <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
            <p class="disclaimer">Use your real email address so you can complete any required email confirmation. Do not share your password with anyone.</p>
        </section>
    </main>
    <script type="module">
        import { getSupabaseClient } from "./supabase.js";
        import { completeTemporaryPasswordChange, loginUser, logoutUser, registerUser, sendPasswordReset, updatePassword } from "./auth.js";

        const workspaceByRole = {
            administrator: "admin.html",
            adviser: "adviser-portal.html",
            officer: "officer.html"
        };
        const authForm = document.querySelector("#auth-form");
        const authMessage = document.querySelector("#auth-message");
        const authTitle = document.querySelector("#login-title");
        const authIntro = document.querySelector("#auth-intro");
        const emailLabel = document.querySelector("#email-label");
        const emailInput = document.querySelector("#email");
        const displayNameLabel = document.querySelector("#display-name-label");
        const displayNameInput = document.querySelector("#display-name");
        const passwordInput = document.querySelector("#password");
        const signInButton = document.querySelector("#sign-in-button");
        const toggleSignUpButton = document.querySelector("#toggle-sign-up");
        const forgotPasswordButton = document.querySelector("#forgot-password");
        const passwordVisibilityButton = document.querySelector("#toggle-password-visibility");
        let isSignUp = false;
        let isPasswordRecovery = false;
        let isTemporaryPasswordChange = false;

        const showMessage = (message, kind = "error") => {
            authMessage.textContent = message;
            authMessage.dataset.kind = kind;
        };

        const setSignUpMode = (enabled) => {
            isSignUp = enabled;
            isPasswordRecovery = false;
            isTemporaryPasswordChange = false;
            authTitle.textContent = enabled ? "Create an account" : "Sign In";
            emailLabel.hidden = false;
            emailInput.required = true;
            authIntro.textContent = enabled
                ? "Create an account to request access. An administrator must approve it and assign your role before you can open a workspace."
                : "Sign in with your account email. New accounts must be approved and assigned a role by an administrator before they can open a workspace.";
            displayNameLabel.hidden = !enabled;
            displayNameInput.required = enabled;
            passwordInput.autocomplete = enabled ? "new-password" : "current-password";
            passwordInput.minLength = 8;
            signInButton.textContent = enabled ? "Create account" : "Sign in";
            toggleSignUpButton.textContent = enabled ? "Already have an account? Sign in" : "Create an account";
            toggleSignUpButton.hidden = false;
            forgotPasswordButton.hidden = enabled;
            forgotPasswordButton.textContent = "Forgot password?";
            passwordInput.value = "";
            passwordInput.type = "password";
            passwordVisibilityButton.setAttribute("aria-label", "Show password");
            passwordVisibilityButton.setAttribute("aria-pressed", "false");
            showMessage("");
        };

        const accessMessage = new URLSearchParams(window.location.search).get("access");
        if (accessMessage === "approval") {
            showMessage("Your account is waiting for administrator approval. You can sign in after an administrator assigns your role and activates it.");
        } else if (accessMessage === "wrong-role") {
            showMessage("Your account is active, but it does not have permission to open that workspace.");
        } else if (accessMessage === "signed-out") {
            showMessage("Please sign in to continue.");
        } else if (accessMessage === "setup") {
            showMessage("Could not verify your account. Check the Supabase setup and try again.");
        }

        toggleSignUpButton.addEventListener("click", () => setSignUpMode(!isSignUp));

        passwordVisibilityButton.addEventListener("click", () => {
            const shouldShow = passwordInput.type === "password";
            passwordInput.type = shouldShow ? "text" : "password";
            passwordVisibilityButton.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
            passwordVisibilityButton.setAttribute("aria-pressed", String(shouldShow));
        });

        forgotPasswordButton.addEventListener("click", async () => {
            const email = document.querySelector("#email").value.trim();
            if (!email) {
                showMessage("Enter your account email first, then choose Forgot password?");
                document.querySelector("#email").focus();
                return;
            }

            forgotPasswordButton.disabled = true;
            try {
                await sendPasswordReset(email);
                showMessage("If an account uses that email, Supabase will send a password-reset link. Check your inbox and spam folder.", "success");
            } catch (error) {
                showMessage(error.message || "Could not request a password reset.");
            } finally {
                forgotPasswordButton.disabled = false;
            }
        });

        const enterPasswordRecovery = () => {
            isPasswordRecovery = true;
            isTemporaryPasswordChange = false;
            isSignUp = false;
            authTitle.textContent = "Set a new password";
            authIntro.textContent = "Choose a new password for your account.";
            emailLabel.hidden = true;
            emailInput.required = false;
            displayNameLabel.hidden = true;
            displayNameInput.required = false;
            passwordInput.required = true;
            passwordInput.minLength = 8;
            passwordInput.autocomplete = "new-password";
            passwordInput.value = "";
            signInButton.textContent = "Update password";
            toggleSignUpButton.hidden = true;
            forgotPasswordButton.hidden = true;
            showMessage("");
            passwordInput.focus();
        };

        const enterTemporaryPasswordChange = () => {
            isPasswordRecovery = true;
            isTemporaryPasswordChange = true;
            isSignUp = false;
            authTitle.textContent = "Choose your password";
            authIntro.textContent = "An administrator set a temporary password for your account. Choose a new password to continue.";
            emailLabel.hidden = true;
            emailInput.required = false;
            displayNameLabel.hidden = true;
            displayNameInput.required = false;
            passwordInput.required = true;
            passwordInput.minLength = 12;
            passwordInput.autocomplete = "new-password";
            passwordInput.value = "";
            signInButton.textContent = "Save new password";
            toggleSignUpButton.hidden = true;
            forgotPasswordButton.hidden = true;
            showMessage("");
            passwordInput.focus();
        };

        getSupabaseClient().then((client) => {
            client.auth.onAuthStateChange((event, session) => {
                if (event === "PASSWORD_RECOVERY") enterPasswordRecovery();
                if (session?.user?.app_metadata?.isoms_password_change_required === true) {
                    enterTemporaryPasswordChange();
                }
            });
            if (new URLSearchParams(window.location.hash.slice(1)).get("type") === "recovery") {
                enterPasswordRecovery();
            }
            if (new URLSearchParams(window.location.search).get("access") === "password-change") {
                client.auth.getUser().then(({ data: { user }, error }) => {
                    if (error) throw error;
                    if (user?.app_metadata?.isoms_password_change_required === true) {
                        enterTemporaryPasswordChange();
                    }
                }).catch((error) => {
                    showMessage(error.message || "Could not verify the required password change.");
                });
            }
        }).catch((error) => {
            showMessage(error.message || "Could not initialize account recovery.");
        });

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            authMessage.textContent = "";
            signInButton.disabled = true;

            try {
                const email = document.querySelector("#email").value.trim();
                const password = passwordInput.value;

                if (isPasswordRecovery) {
                    if (isTemporaryPasswordChange) {
                        await completeTemporaryPasswordChange(password);
                    } else {
                        await updatePassword(password);
                    }
                    await logoutUser();
                    authForm.reset();
                    setSignUpMode(false);
                    showMessage("Password updated. Sign in using your new password.", "success");
                    return;
                }

                if (isSignUp) {
                    const registration = await registerUser(email, password, displayNameInput.value.trim());
                    if (registration.session) await logoutUser();
                    showMessage("Account created. Check your email if confirmation is required. Your workspace access will be available after administrator approval and role assignment.", "success");
                    authForm.reset();
                    return;
                }

                const { user, profile } = await loginUser(email, password);
                if (user.app_metadata?.isoms_password_change_required === true) {
                    enterTemporaryPasswordChange();
                    showMessage("Your administrator set a temporary password. Choose a new password to continue.", "success");
                    return;
                }
                const destination = workspaceByRole[profile.role];
                if (!destination) {
                    showMessage("Your account has an unsupported role. Contact the administrator.");
                    return;
                }

                sessionStorage.setItem("isomsDemoRole", profile.role);
                sessionStorage.setItem("isomsDemoUsername", profile.display_name || user.email || "");
                if (profile.organization_id) {
                    sessionStorage.setItem("isomsDemoOrganizationId", profile.organization_id);
                } else {
                    sessionStorage.removeItem("isomsDemoOrganizationId");
                }
                window.location.assign(destination);
            } catch (error) {
                showMessage(error.message || "Sign-in failed. Please try again.");
            } finally {
                signInButton.disabled = false;
            }
        });
    </script>
</body>
</html>
