<!DOCTYPE html>
<html>

<head>
    <title>SOFT ENG WEBSITE</title>
    <style>
        header {
            position: relative;
            min-height: 60vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url('images/123.png');
            background-size: contain;
            background-position: center top;
        }

        .overlay-image {
            position: absolute;
            width: 1030px;
            height: auto;
            top: 53%;
            left: 65%;
            transform: translate(-50%, -50%);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center top;

        }

        .username {
            color: #0ec526;
            position: absolute;
            font-weight: bold;
            font-size: 5rem;
            top: 2rem;
            left: 10%;
            transform: translateX(-50%);
            margin: 0;

        }

        .text {
            color: #c0e70f;
            font-weight: light;
            position: absolute;
            font-weight: bold;
            top: 7rem;
            left: 12.7%;
            transform: translateX(-50%);
            margin: 0;


        }
    </style>
</head>

<header>
    <p class="username">ISOMS</p>
    <p class="text">Integrated School Organization Management System</p>
    <img class="overlay-image" src="images/girl (1).png">
</header>
</html>
